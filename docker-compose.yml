services:
  mongodb:
    image: mongo:8.0
    container_name: bookmark-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-master}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-master123}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-bookmark}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '-u',
          '${MONGO_USER:-master}',
          '-p',
          '${MONGO_PASSWORD:-master123}',
          '--authenticationDatabase',
          'admin',
          '--eval',
          "db.runCommand('ping').ok",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookmark-backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-5000}:5000'
    environment:
      PORT: ${PORT:-5000}
      MONGO_URI: mongodb://${MONGO_USER:-master}:${MONGO_PASSWORD:-master123}@mongodb:27017/${MONGO_DB_NAME:-bookmark}?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_12345}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_12345}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
